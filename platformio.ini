; esp-led-frame v2
; Pinned platform and library versions are explained in docs/DEVELOPMENT.md (section 5).

[platformio]
default_envs = esp32dev

[common]
led_pin = 2
max_leds = 1024
warning_flags =
    -Wall
    -Wextra

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    fastled/FastLED@3.10.8
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.12.1
    bblanchon/ArduinoJson@7.4.3
; Gzips web/ into src/generated/web_assets.h before every build.
extra_scripts = pre:scripts/embed_web.py
build_flags =
    -DLED_PIN=${common.led_pin}
    -DMAX_LEDS=${common.max_leds}
; FastLED RMT5 asks for 3 memory blocks once Wi-Fi is up, which its own memory-pressure
; check on the classic ESP32 turns into 1 block (64 symbols, about 80 us of data), too
; little to ride out Wi-Fi interrupts. 2 keeps the idle double buffer.
    -DFASTLED_RMT_MEM_BLOCKS_NETWORK_MODE=2
; Warnings only for project code; FastLED has its own warnings.
build_src_flags = ${common.warning_flags}

[env:esp32dev]
extends = esp32_base
build_type = debug
build_flags =
    ${esp32_base.build_flags}
    -DLOG_LEVEL=4
    -DLEDFRAME_CONSOLE

; Same firmware as esp32dev, uploaded over Wi-Fi with ArduinoOTA (espota).
;   pio run -e esp32dev-ota -t upload
;   pio run -e esp32dev-ota -t upload --upload-port 192.168.0.14
; With an OTA password set, add it in the environment: PLATFORMIO_UPLOAD_FLAGS=--auth=<password>
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ledframe.local

[env:esp32dev-release]
extends = esp32_base
build_type = release
build_flags =
    ${esp32_base.build_flags}
    -DLOG_LEVEL=3

; Host tests. FastLED runs in its stub variant; every flag below is required (docs/DEVELOPMENT.md, section 6).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
; Only hardware-independent modules are compiled on the host.
build_src_filter =
    -<*>
    +<core/>
    +<render/>
    +<effects/>
    +<state/>
    +<app/ConsoleParser.cpp>
    +<net/ApiJson.cpp>
    +<net/WsProtocol.cpp>
    +<net/DnsMessage.cpp>
    -<render/LedOutput.cpp>
    -<state/Storage.cpp>
lib_compat_mode = off
lib_deps =
    fastled/FastLED@3.10.8
    bblanchon/ArduinoJson@7.4.3
extra_scripts = pre:scripts/native_env.py
build_flags =
    -std=gnu++17
    -include stdint.h
    -DLEDFRAME_NATIVE
    -DLED_PIN=${common.led_pin}
    -DMAX_LEDS=${common.max_leds}
    -DLOG_LEVEL=4
    -DFASTLED_STUB_IMPL
    -DARDUINO=10819
    -DFASTLED_USE_STUB_ARDUINO
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=0
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0
    -DARDUINOJSON_ENABLE_PROGMEM=0
build_src_flags = ${common.warning_flags}
