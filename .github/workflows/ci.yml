name: CI

on:
  push:
  pull_request:

env:
  PLATFORMIO_VERSION: "6.2.0"

jobs:
  firmware:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32dev-release]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/firmware.factory.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
          if-no-files-found: error

  native-tests:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-native-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Run native tests
        run: pio test -e native

  # Runs only for tags like v2.2.0, after both builds and the tests pass.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, native-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag against Version.h
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "kVersion\[\] = \"${version}\"" src/core/Version.h; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match kVersion in src/core/Version.h"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir dist
          for env in esp32dev esp32dev-release; do
            src="artifacts/firmware-${env}"
            cp "${src}/firmware.factory.bin" "dist/esp-led-frame-${VERSION}-${env}-factory.bin"
            cp "${src}/firmware.bin" "dist/esp-led-frame-${VERSION}-${env}-ota.bin"
          done
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)

      - name: Write release notes
        run: |
          changes=$(grep -E "^\| ${VERSION} \|" docs/DEVELOPMENT.md | cut -d'|' -f3 | sed 's/^ *//; s/ *$//')
          cat > notes.md <<EOF
          ## Zmiany

          ${changes:-Zobacz docs/DEVELOPMENT.md, rozdział 9.}

          ## Pliki

          | Plik | Do czego |
          |---|---|
          | \`esp-led-frame-${VERSION}-esp32dev-factory.bin\` | pełny obraz do wgrania przez USB od adresu \`0x0\` (pierwsza instalacja, webowy flasher) |
          | \`esp-led-frame-${VERSION}-esp32dev-ota.bin\` | aktualizacja z UI (Device → Firmware) |
          | \`esp-led-frame-${VERSION}-esp32dev-release-*.bin\` | to samo bez konsoli szeregowej i bez logów debug |
          | \`SHA256SUMS.txt\` | sumy kontrolne |

          Instrukcja wgrywania: README, rozdział „Z przeglądarki, bez PlatformIO”.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
