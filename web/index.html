<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LED frame</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="bar">
  <div class="bar-row">
    <h1>LED frame</h1>
    <span id="link" class="link" data-state="connecting" title="Connecting">
      <span class="dot"></span><span id="link-text">Connecting</span>
    </span>
    <button id="power" class="power" type="button" aria-pressed="false" title="Power">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
      <span class="sr">Power</span>
    </button>
  </div>
  <label class="bri">
    <span class="sr">Brightness</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <input id="bri" type="range" min="0" max="1000" value="708">
    <output id="bri-value">71%</output>
  </label>
  <nav class="tabs" role="tablist" aria-label="Pages">
    <a id="tab-effects" href="#effects" role="tab" aria-controls="page-effects">Effects</a>
    <a id="tab-presets" href="#presets" role="tab" aria-controls="page-presets">Presets</a>
    <a id="tab-device" href="#device" role="tab" aria-controls="page-device">Device</a>
  </nav>
</header>

<main>
  <div id="page-effects" class="page effects-page" role="tabpanel" aria-labelledby="tab-effects">
    <section class="preview-area" aria-labelledby="preview-title">
      <div class="section-head">
        <h2 id="preview-title">Live preview</h2>
        <input id="preview-toggle" type="checkbox" class="switch" role="switch" aria-labelledby="preview-title">
      </div>
      <div id="preview" class="grid-box" hidden></div>
    </section>

    <section class="tiles-area" aria-labelledby="effects-title">
      <h2 id="effects-title">Effects</h2>
      <div id="effects" class="tiles" role="radiogroup" aria-labelledby="effects-title"></div>
    </section>

    <section id="settings" class="settings-area" aria-labelledby="settings-title" hidden>
      <h2 id="settings-title">Effect settings</h2>
      <div id="widget"></div>
      <div id="params" class="params"></div>
    </section>
  </div>

  <div id="page-presets" class="page" role="tabpanel" aria-labelledby="tab-presets" hidden>
    <section aria-labelledby="presets-title">
      <h2 id="presets-title">Presets</h2>
      <div id="presets"></div>
    </section>
  </div>

  <div id="page-device" class="page" role="tabpanel" aria-labelledby="tab-device" hidden>
    <div id="device"></div>
  </div>

  <p id="notice" class="notice" hidden></p>
</main>

<footer id="status" class="status" aria-label="Device information"></footer>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
